  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  </head>
  <body>
    <!-- ANALYTICS_GTM_NOSCRIPT -->
    <!-- ANALYTICS_PIXEL_NOSCRIPT -->
    <div id="root"></div>
    <script>
      (function () {
        var KEY = 'eruchi_css_retry';
        function applied() {
          return getComputedStyle(document.documentElement).getPropertyValue('--app-css').trim() === '1';
        }
        function markOk() {
          try { sessionStorage.removeItem(KEY); } catch (e) {}
        }
        function reloadOnce() {
          try {
            if (sessionStorage.getItem(KEY) === '1') return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            return;
          }
          location.reload();
        }
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || el.tagName !== 'LINK' || el.rel !== 'stylesheet') return;
          var href = el.getAttribute('href') || '';
          if (href.indexOf('fonts.googleapis.com') !== -1) return;
          reloadOnce();
        }, true);
        window.addEventListener('vite:preloadError', function (event) {
          if (event && event.preventDefault) event.preventDefault();
          reloadOnce();
        });
        function appSheetLinked() {
          var links = document.getElementsByTagName('link');
          for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href') || '';
            if (links[i].rel === 'stylesheet' && href.indexOf('/assets/') !== -1) return true;
          }
          return false;
        }
        function check() {
          if (applied()) {
            markOk();
            return;
          }
          if (appSheetLinked()) reloadOnce();
        }
        window.addEventListener('load', function () { setTimeout(check, 500); });
        setTimeout(check, 4000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
